# Throwaway Mattermost sandbox for the recreator.
# - No volumes: `docker compose down -v` wipes everything between runs.
# - Port bound to 127.0.0.1 only, so nothing outside this machine can reach it.
# - Telemetry, marketplace and email are off so the sandbox doesn't phone home.
# MM_IMAGE is set by the pipeline from the ticket's version (or your override).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mmuser_password      # sandbox-only credential
      POSTGRES_DB: mattermost
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 3s
      retries: 20

  mattermost:
    image: ${MM_IMAGE:?MM_IMAGE must be set}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8065:8065"
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:mmuser_password@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: http://localhost:8065
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"   # lets us create the admin with mmctl
      MM_LOGSETTINGS_ENABLEDIAGNOSTICS: "false"
      MM_PLUGINSETTINGS_ENABLEMARKETPLACE: "false"
      MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS: "false"
      MM_LOGSETTINGS_CONSOLELEVEL: DEBUG           # richer logs for the agent
